name: Release

# Builds the Windows installer and the portable exe and publishes both as a
# GitHub Release whenever the version in package.json changes on main. Safe to
# run on every push: it no-ops if a release for the current version already
# exists. Can also be triggered by hand to (re)build the current version.
#
# The version check is a separate job so the Windows build never starts for a
# version that is already out.
#
# Nothing is compiled here but the app. The browser engine used to be built from
# source in this workflow — a manul-browser checkout, a Go toolchain and a
# TypeScript build before packaging could begin — and it is not part of the app
# any more: browser control is a plugin with its own repository and its own
# released binary.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'electron-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          ver=$(node -p "require('./package.json').version")
          if [ -z "$ver" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          echo "Version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet for ${{ steps.version.outputs.tag }} - will create one."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Windows build and publish
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit tests only. `npm run smoke` boots a real window and drives the
      # renderer, which is worth running before a release but needs a desktop
      # session it does not reliably get here.
      - name: Test
        run: npm test

      # --publish never: the release is created by gh below, so electron-builder
      # only has to produce the files. Left to itself it would upload them to a
      # draft release, which never becomes visible.
      #
      # latest.yml is still written — it comes from `publish` in
      # electron-builder.yml, not from this flag — and MUST be uploaded with the
      # installer. It is the file the in-app updater reads to find a new build.
      - name: Package
        run: npx electron-builder --win nsis portable --publish never

      - name: Create tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $setup = "dist/WastelandNext-$version-setup.exe"
          $portable = "dist/WastelandNext-$version-portable.exe"
          $latest = "dist/latest.yml"
          # The updater asks for "<installer>.blockmap" on both the installed
          # build and the new one so it can download only the parts that
          # changed. A release without it still updates - it just pulls all
          # 75 MB again every time, for a build that usually differs by little.
          $blockmap = "$setup.blockmap"
          foreach ($f in @($setup, $blockmap, $portable, $latest)) {
            if (-not (Test-Path $f)) {
              Write-Error "Expected artifact not found: $f"
              exit 1
            }
          }
          # The updater resolves the installer through the name recorded in
          # latest.yml, so the uploaded asset name has to match it exactly.
          $expected = (Select-String -Path $latest -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($expected -ne (Split-Path $setup -Leaf)) {
            Write-Error "latest.yml points at '$expected' but the installer is '$(Split-Path $setup -Leaf)' - the updater would 404."
            exit 1
          }
          gh release create "${{ needs.check.outputs.tag }}" $setup $blockmap $portable $latest `
            --title "${{ needs.check.outputs.tag }}" `
            --generate-notes
