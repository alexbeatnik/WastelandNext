# Packaging.
#
# Nothing is staged before this runs any more. The app used to build the
# manul-browser engine from source and ship it through `extraResources`, which
# meant a release needed a Go toolchain and a checkout of another repository on
# the build machine. Browser control is a plugin now and carries its own engine,
# so what is packaged here is the app and nothing else.
appId: com.alexbeatnik.wasteland-next
productName: Wasteland Next
copyright: Copyright 2026 Oleksii Poliakov

directories:
  output: dist
  buildResources: assets

# Where the in-app updater looks for a newer build. electron-builder also writes
# `latest.yml` from this, which is the file the updater actually reads — the
# release workflow must upload it beside the installer or nothing self-updates.
publish:
  - provider: github
    owner: alexbeatnik
    repo: WastelandNext

# Only what the app actually loads at runtime. Tests and build scripts are
# excluded here.
files:
  - src/**/*
  - package.json
  # Apache 2.0 §4(a): recipients of a redistribution get a copy of the licence.
  - LICENSE
  # Naming any include at all replaces the default `**/*`, which is what used to
  # pull node_modules in. Without this line the packaged app starts and then
  # dies on `Cannot find module 'electron-updater'` — and only when packaged,
  # since a development run resolves it from the checkout. electron-builder
  # prunes devDependencies itself, so this ships the updater and nothing else.
  - node_modules/**/*
  - '!**/*.map'

win:
  icon: assets/icon.ico
  target:
    # A single self-contained .exe that runs with no install, and a normal
    # installer for anyone who would rather have Start-menu entries.
    - portable
    - nsis

portable:
  artifactName: WastelandNext-${version}-portable.exe

nsis:
  artifactName: WastelandNext-${version}-setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
